# Checks the layout and fails on any difference; it never changes a file.
on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: format-check

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The version `.clang-format` was written with; another may format differently.
      - name: clang-format
        run: pipx install clang-format==23.1.3

      - name: Check
        run: tools/check-format.sh
