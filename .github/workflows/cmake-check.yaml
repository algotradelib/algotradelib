on:
  workflow_dispatch:
  push:
    branches: [main, master, 'hotfix/*', 'release/*', develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'examples/**'
      - '.github/workflows/cmake-check.yaml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'examples/**'
      - '.github/workflows/cmake-check.yaml'

name: cmake-check

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cxx_std: [17, 20, 23]
        compiler: [llvm, gcc, msvc, apple-clang]
        exclude:
          - os: ubuntu-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: apple-clang
          - os: windows-latest
            compiler: apple-clang
          - os: windows-latest
            compiler: gcc
          - os: macos-latest
            compiler: msvc
          # Drop macOS-gcc until the first release.
          - os: macos-latest
            compiler: gcc
          # While the repository is private: C++20 and C++23 on Ubuntu only.
          - os: macos-latest
            cxx_std: 20
          - os: macos-latest
            cxx_std: 23
          - os: windows-latest
            cxx_std: 20
          - os: windows-latest
            cxx_std: 23
        # test-coverage builds and runs the tests in this configuration; this job builds the examples only.
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx_std: 17
            tests: 'OFF'

    name: ${{ matrix.os }} (${{ matrix.compiler }}-C++${{ matrix.cxx_std }})

    steps:
      - uses: actions/checkout@v7

      - uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          vcvarsall: ${{ runner.os == 'Windows' }}
          cmake: true
          ninja: true

      - name: OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # Later: openssl@4
      - name: OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL;C:/Program Files/OpenSSL/lib/VC/x64/MD" >> "$GITHUB_ENV"

      # Add later:
      #  - ATL_USE_EIGEN
      #  - CMAKE_CXX_FLAGS
      - uses: threeal/cmake-action@v2.1.0
        with:
          run-build: true
          generator: Ninja
          options: |
            CMAKE_CXX_STANDARD=${{ matrix.cxx_std }}
            ATL_FETCH_DEPS=ON
            ATL_BUILD_EXAMPLES=${{ matrix.os == 'ubuntu-latest' && 'ON' || 'OFF' }}
            ATL_BUILD_TESTS=${{ matrix.tests || 'ON' }}
            ATL_ENABLE_COVERAGE=OFF

      - uses: threeal/ctest-action@v1.1.0
        if: matrix.tests != 'OFF'
        with:
          test-dir: build/tests
          args: --output-on-failure -j 4 ${{ matrix.compiler == 'msvc' && '-LE compile-fail' || '' }}
