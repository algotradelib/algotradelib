on:
  workflow_dispatch:
  push:
    branches: [main, master, 'hotfix/*', 'release/*', develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'examples/**'
      - '.github/workflows/cmake-check.yaml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'examples/**'
      - '.github/workflows/cmake-check.yaml'

name: cmake-check

jobs:
  build:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, cxx_std: 17, compiler: 'llvm'}
          # test-coverage builds and runs the tests in this configuration; this job builds the examples only.
          - {os: ubuntu-latest, cxx_std: 17, compiler: 'gcc', tests: 'OFF'}
          - {os: ubuntu-latest, cxx_std: 20, compiler: 'llvm'}
          - {os: ubuntu-latest, cxx_std: 20, compiler: 'gcc'}
          - {os: ubuntu-latest, cxx_std: 23, compiler: 'llvm'}
          - {os: ubuntu-latest, cxx_std: 23, compiler: 'gcc'}

          - {os: macos-latest, cxx_std: 17, compiler: 'apple-clang'}
          - {os: macos-latest, cxx_std: 17, compiler: 'llvm'}
          # Drop macOS-gcc until the first release.
          # - {os: macos-latest, cxx_std: 17, compiler: 'gcc'}

          - {os: windows-latest, cxx_std: 17, compiler: 'msvc'}
          - {os: windows-latest, cxx_std: 17, compiler: 'llvm'}

    name: ${{ matrix.config.os }} (${{ matrix.config.compiler }}-C++${{ matrix.config.cxx_std }})

    steps:
      - uses: actions/checkout@v7

      - uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.config.compiler }}
          vcvarsall: ${{ runner.os == 'Windows' }}
          cmake: true
          ninja: true

      - name: OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # Later: openssl@4
      - name: OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL;C:/Program Files/OpenSSL/lib/VC/x64/MD" >> "$GITHUB_ENV"

      # Add later:
      #  - ATL_USE_EIGEN
      #  - CMAKE_CXX_FLAGS
      - uses: threeal/cmake-action@v2.1.0
        with:
          run-build: true
          generator: Ninja
          options: |
            CMAKE_CXX_STANDARD=${{ matrix.config.cxx_std }}
            ATL_FETCH_DEPS=ON
            ATL_BUILD_EXAMPLES=${{ matrix.config.os == 'ubuntu-latest' && 'ON' || 'OFF' }}
            ATL_BUILD_TESTS=${{ matrix.config.tests || 'ON' }}
            ATL_ENABLE_COVERAGE=OFF

      - uses: threeal/ctest-action@v1.1.0
        if: matrix.config.tests != 'OFF'
        with:
          test-dir: build/tests
          args: --output-on-failure -j 4 ${{ matrix.config.compiler == 'msvc' && '-LE compile-fail' || '' }}
