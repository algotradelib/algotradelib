on:
  push:
    branches: [main, master, 'hotfix/*', 'release/*', develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'examples/live_program.hpp'
      - 'codecov.yml'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'examples/live_program.hpp'
      - 'codecov.yml'
      - '.github/workflows/test-coverage.yaml'

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: aminya/setup-cpp@v1
        with:
          compiler: gcc
          cmake: true
          ninja: true

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # cmake-check skips its tests for Ubuntu GCC C++17 because this job runs them: keep the standard pinned.
      - uses: threeal/cmake-action@v2.1.0
        with:
          run-build: true
          generator: Ninja
          options: |
            CMAKE_BUILD_TYPE=Debug
            CMAKE_CXX_FLAGS_DEBUG=-g0
            CMAKE_CXX_STANDARD=17
            ATL_FETCH_DEPS=ON
            ATL_BUILD_EXAMPLES=OFF
            ATL_BUILD_TESTS=ON
            ATL_ENABLE_COVERAGE=ON

      # The compile-fail probes and the scaffold build run no instrumented code; they belong to a build check.
      - uses: threeal/ctest-action@v1.1.0
        with:
          test-dir: build/tests
          args: -LE "^(compile-fail|scaffold)$" -j 4

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          # A fork has no Codecov token, so a failed upload fails only this repository's runs.
          fail_ci_if_error: ${{ !github.event.repository.fork }}
          token: ${{ secrets.CODECOV_TOKEN }}
          codecov_yml_path: codecov.yml

      - name: Show ctest output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find build/tests/Testing/Temporary -name 'LastTest.log' -exec cat '{}' \; || true
        shell: bash
