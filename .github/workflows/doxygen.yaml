# Render doxygen into the pages repository: cpp/ from main, cpp/dev/ from develop
on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]

name: doxygen

jobs:
  doxygen:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ssciwr/doxygen-install@v2
        with:
          version: "1.18.0"

      - name: Install graphviz and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y graphviz libssl-dev
    
      - name: Render doxygen
        run: |
          cmake -B build -DATL_FETCH_DEPS=ON
          cmake --build build --target docs

      - name: Deploy to GitHub pages 🚀
        # A fork has no token for the pages repository; it renders the docs and stops here.
        if: ${{ !github.event.repository.fork && contains(fromJSON('["main", "master", "develop"]'), github.ref_name) }}
        uses: JamesIves/github-pages-deploy-action@v4.6.1
        with:
          token: ${{ secrets.ALGOTRADELIB_PAGE_PAT }}
          repository-name: algotradelib/algotradelib.github.io
          folder: doxygen/docs/html
          branch: main
          target-folder: ${{ github.ref_name == 'develop' && 'cpp/dev' || 'cpp' }}
          clean: true
          clean-exclude: dev